<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2433">Câblage du module TOSLINKBee sur la carte ES3C35P</text>

  <!-- module -->
  <rect x="40" y="80" width="300" height="420" rx="16" fill="#1d2433"/>
  <text x="190" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">TOSLINKBee V1.0</text>
  <text x="190" y="136" text-anchor="middle" font-size="14" fill="#c9d1e6">DIR9001 · entrée optique S/PDIF</text>
  <rect x="140" y="452" width="100" height="40" rx="6" fill="#6b7a99"/>
  <text x="190" y="477" text-anchor="middle" font-size="13" fill="#ffffff">prise optique</text>

  <!-- carte -->
  <rect x="660" y="80" width="300" height="420" rx="16" fill="#0f3d5e"/>
  <text x="810" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">ES3C35P</text>
  <text x="810" y="136" text-anchor="middle" font-size="14" fill="#c9e3f6">ESP32-S3 · maître I2S (I2S 1)</text>
  <text x="810" y="178" text-anchor="middle" font-size="13" fill="#9fd0f0">connecteur série P2 (UART)</text>
  <text x="810" y="356" text-anchor="middle" font-size="13" fill="#9fd0f0">connecteur d'extension</text>

  <!-- lignes : y, couleur, broche module, broche carte, signal, sens -->
  <g font-size="15">
    <!-- +5V -->
    <circle cx="340" cy="200" r="7" fill="#e0303a"/><circle cx="660" cy="200" r="7" fill="#e0303a"/>
    <line x1="340" y1="200" x2="660" y2="200" stroke="#e0303a" stroke-width="5"/>
    <text x="52" y="205" fill="#ffffff">J2-1 · +5 V (entrée)</text>
    <text x="948" y="205" text-anchor="end" fill="#ffffff">5V</text>
    <text x="500" y="190" text-anchor="middle" fill="#e0303a" font-weight="700">alimentation 5 V</text>

    <!-- GND -->
    <circle cx="340" cy="250" r="7" fill="#222"/><circle cx="660" cy="250" r="7" fill="#222"/>
    <line x1="340" y1="250" x2="660" y2="250" stroke="#222" stroke-width="5"/>
    <text x="52" y="255" fill="#ffffff">J2-6 · GND</text>
    <text x="948" y="255" text-anchor="end" fill="#ffffff">GND</text>
    <text x="500" y="240" text-anchor="middle" fill="#222" font-weight="700">masse commune</text>

    <!-- données -->
    <circle cx="340" cy="300" r="7" fill="#1f9d55"/><circle cx="660" cy="300" r="7" fill="#1f9d55"/>
    <line x1="340" y1="300" x2="652" y2="300" stroke="#1f9d55" stroke-width="5"/>
    <polygon points="660,300 644,292 644,308" fill="#1f9d55"/>
    <text x="52" y="305" fill="#ffffff">J1-9 · SD (données)</text>
    <text x="948" y="305" text-anchor="end" fill="#ffffff">RXD = GPIO44</text>
    <text x="500" y="290" text-anchor="middle" fill="#1f9d55" font-weight="700">son numérique → carte</text>

    <!-- BCK -->
    <circle cx="340" cy="390" r="7" fill="#d98a00"/><circle cx="660" cy="390" r="7" fill="#d98a00"/>
    <line x1="348" y1="390" x2="660" y2="390" stroke="#d98a00" stroke-width="5"/>
    <polygon points="340,390 356,382 356,398" fill="#d98a00"/>
    <text x="52" y="395" fill="#ffffff">J1-8 · BCK</text>
    <text x="948" y="395" text-anchor="end" fill="#ffffff">IO45</text>
    <text x="500" y="380" text-anchor="middle" fill="#d98a00" font-weight="700">horloge des bits ← carte</text>

    <!-- LRCK -->
    <circle cx="340" cy="440" r="7" fill="#7b3fe4"/><circle cx="660" cy="440" r="7" fill="#7b3fe4"/>
    <line x1="348" y1="440" x2="660" y2="440" stroke="#7b3fe4" stroke-width="5"/>
    <polygon points="340,440 356,432 356,448" fill="#7b3fe4"/>
    <text x="52" y="445" fill="#ffffff">J1-10 · LRCK</text>
    <text x="948" y="445" text-anchor="end" fill="#ffffff">IO46</text>
    <text x="500" y="430" text-anchor="middle" fill="#7b3fe4" font-weight="700">horloge gauche/droite ← carte</text>

    <!-- 3,3 V : ne pas brancher -->
    <circle cx="340" cy="345" r="7" fill="none" stroke="#e0303a" stroke-width="3"/>
    <line x1="350" y1="345" x2="410" y2="345" stroke="#e0303a" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="418" y="350" fill="#e0303a" font-weight="700">✕ ne rien brancher</text>
    <text x="52" y="350" fill="#ffb3b8">J2-5 · +3,3 V (SORTIE)</text>
  </g>
  <text x="500" y="535" text-anchor="middle" font-size="14" fill="#5b6b82">Flèches : sens du signal. La carte fournit les deux horloges (BCK, LRCK) ; le module renvoie les données (SD). 48 kHz, cases de 32 bits.</text>
</svg>
